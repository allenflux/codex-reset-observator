[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "codex-reset-observatory"
version = "1.0.0"
description = "Python dashboard for Codex usage reset signals and history"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1.6,<4",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
observatory = "observatory.cli:main"

[project.optional-dependencies]
ml = ["numpy>=2.0,<3", "scikit-learn>=1.6,<2"]

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
  "playwright>=1.50,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["observatory"]

[tool.hatch.build.targets.sdist]
include = ["/observatory", "/tests_python", "/pyproject.toml", "/README.md", "/LICENSE", "/uv.lock", "/requirements.txt", "/docs/python*", "/reports/python-migration"]

[tool.pytest.ini_options]
testpaths = ["tests_python"]
addopts = "-ra"
markers = ["browser: requires a locally installed Chromium browser"]

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["observatory/**/*.py", "tests_python/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["observatory"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
