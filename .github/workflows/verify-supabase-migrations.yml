name: Verify Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'observatory/storage.py'
      - '.github/workflows/verify-supabase-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --frozen
      - name: Start isolated local database
        run: npx --yes supabase@2.116.0 start
      - name: Apply complete migrations twice
        run: |
          npx --yes supabase@2.116.0 db reset --local --no-seed
          npx --yes supabase@2.116.0 db reset --local --no-seed
      - name: Python repository and webhook contracts
        run: uv run pytest tests_python/test_storage.py tests_python/test_api.py
      - name: Check generated diff
        run: git diff --check
      - name: Stop local database
        if: always()
        run: npx --yes supabase@2.116.0 stop --no-backup
