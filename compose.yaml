x-runtime: &runtime
  build:
    context: .
    target: runtime
  image: codex-reset-observatory:local
  env_file:
    - .env
  environment:
    COLLECTION_BACKEND: mysql
    COLLECTION_INTERVAL_SECONDS: "${COLLECTION_INTERVAL_SECONDS:-3600}"
    SOCIAL_COLLECTION_ENABLED: "${SOCIAL_COLLECTION_ENABLED:-true}"
    SOCIAL_COLLECTION_INTERVAL_SECONDS: "${SOCIAL_COLLECTION_INTERVAL_SECONDS:-300}"
    FETCH_LIVE_STATUS: "${FETCH_LIVE_STATUS:-true}"
    SITE_URL: "${SITE_URL:-}"
  init: true
  restart: unless-stopped
  stop_grace_period: 120s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *runtime
    command: ["observatory", "serve", "--host", "0.0.0.0", "--port", "9090"]
    ports:
      - "0.0.0.0:${PORT:-9090}:9090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          response = urllib.request.urlopen('http://127.0.0.1:9090/healthz', timeout=5);
          raise SystemExit(0 if response.status == 200 and json.load(response).get('status') == 'ok' else 1)
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  collector:
    <<: *runtime
    command: ["observatory", "collect"]
    healthcheck:
      test: ["CMD", "observatory", "collection-status", "--check-fresh"]
      interval: 5m
      timeout: 45s
      start_period: 2m
      retries: 3
